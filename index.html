<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutter App Preview - لقاء الأرواح</title>
    <!-- Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d0f18 0%, #1a1c29 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* نافذة القفل بكلمة السر */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 24, 0.96);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 360px;
            width: 90%;
        }

        .lock-box h2 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #ffb7c5;
        }

        .lock-box p {
            margin-bottom: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .lock-box input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            letter-spacing: 3px;
        }

        .lock-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lock-box button:hover {
            opacity: 0.9;
        }

        /* الكانفاس للألعاب النارية في الأمام وبتفاعل غير حجب للنصوص */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50; /* وضعها فوق العناصر لإعطاء تأثير رائع */
        }

        /* حاوية الويب الأساسية */
        .web-container {
            width: 100%;
            max-width: 500px;
            background: rgba(20, 23, 34, 0.85);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        .app-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .app-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quote-box {
            text-align: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        .quote-text {
            font-size: 15px;
            color: #ffb7c5;
            font-weight: 500;
            line-height: 1.6;
        }

        /* بطاقة المسار والأفاتار */
        .track-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 20px 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .avatars-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: flex-end;
            position: relative;
            min-height: 85px;
            margin-bottom: 8px;
        }

        .person-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 2;
            transition: transform 0.3s ease-out;
            position: absolute;
            bottom: 0;
        }

        .person-info.p1-box {
            right: 0;
        }

        .person-info.p2-box {
            left: 0;
        }

        /* صور صغيرة محاذية للشريط */
        .avatar-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            padding: 2px;
            position: relative;
            transition: all 0.5s ease;
            background: #1a1c29;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2e43;
        }

        .person-name {
            font-size: 12px;
            font-weight: 700;
        }

        /* حركة الدوران الحلزوني عند الاكتمال */
        .fusing .avatar-wrapper.person1 {
            animation: spiralRotateLeft 3s infinite linear;
        }

        .fusing .avatar-wrapper.person2 {
            animation: spiralRotateRight 3s infinite linear;
        }

        @keyframes spiralRotateLeft {
            0% { transform: rotate(0deg) translateX(10px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(10px) rotate(-360deg); }
        }

        @keyframes spiralRotateRight {
            0% { transform: rotate(0deg) translateX(-10px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(-10px) rotate(-360deg); }
        }

        .progress-track-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .progress-fill-right {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 0%;
            border-radius: 4px 0 0 4px;
            transition: width 0.3s ease-out;
        }

        .progress-fill-left {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            border-radius: 0 4px 4px 0;
            transition: width 0.3s ease-out;
        }

        .progress-status {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        /* العداد */
        .countdown-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .countdown-title {
            font-size: 13px;
            color: #8f95b2;
            margin-bottom: 12px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 6px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: 20px;
            font-weight: 900;
        }

        .time-label {
            font-size: 11px;
            color: #8f95b2;
            margin-top: 2px;
        }

        .target-date-box {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6ee7b7 0%, #3b82f6 100%);
            border: none;
            border-radius: 14px;
            color: #0d0f18;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* رسالة التنبيه العائمة */
        #custom-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 117, 140, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10000;
            transition: transform 0.3s ease;
        }

        #custom-alert.show {
            transform: translateX(-50%) translateY(0);
        }

        /* نافذة الإعدادات */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #191c29;
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            border-radius: 24px;
            padding: 25px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            outline: none;
        }

        .color-row {
            display: flex;
            gap: 10px;
        }

        .color-row > div {
            flex: 1;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ff758c;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- التنبيه العائم -->
    <div id="custom-alert">رمز السر غير صحيح!</div>

    <!-- شاشة القفل بكلمة السر -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>🔒 منطقة خاصة</h2>
            <p>أدخل رمز السر للدخول إلى عالمنا</p>
            <input type="password" id="passcode-input" placeholder="••••">
            <button onclick="checkPasscode()">دخول</button>
        </div>
    </div>

    <!-- الكانفاس للألعاب النارية واضحة وفي الأمام -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- حاوية الويب الأساسية -->
    <div class="web-container">
        <div class="app-header">
            <button class="icon-btn" onclick="lockApp()" title="قفل">🔒</button>
            <div class="app-title">لقاء الأرواح ✨</div>
            <button class="icon-btn" onclick="openModal()" title="إعدادات">⚙️</button>
        </div>

        <div class="app-content">
            <div class="quote-box">
                <p class="quote-text" id="display-quote">خطان يسيران بشوق ولهفة، ليلتقيا في موعد القدر الموعود...</p>
            </div>

            <div class="track-card" id="track-card-el">
                <div class="avatars-container" id="avatars-container">
                    <div class="person-info p1-box" id="p1-box">
                        <span class="person-name" id="display-name-p1">ابوبكر</span>
                        <div class="avatar-wrapper person1" id="wrap-p1">
                            <img id="display-img-p1" src="./p1.jpg" onerror="this.src='https://placehold.co/150x150/6ee7b7/0d0f18?text=%D8%A7%D8%A8%D9%88%D8%A8%D9%83%D8%B1'" class="avatar-img">
                        </div>
                    </div>

                    <div class="person-info p2-box" id="p2-box">
                        <span class="person-name" id="display-name-p2">مارية</span>
                        <div class="avatar-wrapper person2" id="wrap-p2">
                            <img id="display-img-p2" src="./p2.jpg" onerror="this.src='https://placehold.co/150x150/ff758c/0d0f18?text=%D9%85%D8%A7%D8%B1%D9%8A%D8%A9'" class="avatar-img">
                        </div>
                    </div>
                </div>

                <div class="progress-track-bg">
                    <div class="progress-fill-right" id="fill-p1"></div>
                    <div class="progress-fill-left" id="fill-p2"></div>
                </div>
                <div class="progress-status" id="progress-status-text">جاري تقارب المسارين...</div>
            </div>

            <div class="countdown-card">
                <div class="countdown-title">الوقت المتبقي حتى اللقاء</div>
                <div class="countdown-grid">
                    <div class="time-box"><span class="time-value" id="cd-days">00</span><span class="time-label">يوم</span></div>
                    <div class="time-box"><span class="time-value" id="cd-hours">00</span><span class="time-label">ساعة</span></div>
                    <div class="time-box"><span class="time-value" id="cd-mins">00</span><span class="time-label">دقيقة</span></div>
                    <div class="time-box"><span class="time-value" id="cd-secs">00</span><span class="time-label">ثانية</span></div>
                </div>

                <div class="target-date-box" id="target-date-display">
                    📅 موعد اللقاء: <span id="display-date-text">--</span>
                </div>
            </div>

            <button class="action-btn" onclick="toggleCelebration()">✨ تبديل وضع الاحتفال والدوران</button>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>الإعدادات</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <div class="form-group"><label>تاريخ اللقاء</label><input type="datetime-local" id="target-date-input"></div>
            <div class="form-group"><label>العبارة الشاعرية</label><textarea id="quote-input" rows="2"></textarea></div>

            <div class="form-group color-row">
                <div><label>لون Person 1 (يمين)</label><input type="color" id="color-p1-input"></div>
                <div><label>لون Person 2 (يسار)</label><input type="color" id="color-p2-input"></div>
            </div>

            <div class="form-group color-row">
                <div><label>لون العبارة والعداد</label><input type="color" id="color-text-input"></div>
                <div><label>رمز السر الجديد</label><input type="text" id="new-passcode-input" placeholder="رمز السر"></div>
            </div>

            <div class="form-group color-row">
                <div><label>اسم الشخص 1</label><input type="text" id="name-p1-input"></div>
                <div><label>اسم الشخص 2</label><input type="text" id="name-p2-input"></div>
            </div>

            <div class="form-group color-row">
                <div><label>صورة الشخص 1</label><input type="file" id="img-p1-input" accept="image/*"></div>
                <div><label>صورة الشخص 2</label><input type="file" id="img-p2-input" accept="image/*"></div>
            </div>

            <button class="save-btn" onclick="saveSettings()">حفظ التعديلات</button>
            <button class="reset-btn" onclick="resetToDefaults()">إعادة التعيين الافتراضية</button>
        </div>
    </div>

    <script>
        const defaultSettings = {
            targetDate: "2027-06-15T00:00:00",
            quote: "خطان يسيران بشوق ولهفة، ليلتقيا في موعد القدر الموعود...",
            nameP1: "ابوبكر",
            nameP2: "مارية",
            colorP1: "#6ee7b7",
            colorP2: "#ff758c",
            textColor: "#ffb7c5",
            passcode: "2006",
            imgP1: "./p1.jpg",
            imgP2: "./p2.jpg"
        };

        let config = {...defaultSettings};
        const saved = localStorage.getItem('soul_meet_config_v5');
        if (saved) { try { config = JSON.parse(saved); } catch(e){} }

        function showAlert(msg) {
            const el = document.getElementById('custom-alert');
            el.innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function initUI() {
            const d = new Date(config.targetDate);
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('display-date-text').innerText = d.toLocaleDateString('ar-EG', dateOptions);
            document.getElementById('target-date-display').style.color = config.textColor;
            document.getElementById('display-quote').innerText = config.quote;
            document.getElementById('display-name-p1').innerText = config.nameP1;
            document.getElementById('display-name-p2').innerText = config.nameP2;
            document.getElementById('display-img-p1').src = config.imgP1;
            document.getElementById('display-img-p2').src = config.imgP2;

            document.getElementById('display-quote').style.color = config.textColor;
            document.getElementById('display-name-p1').style.color = config.colorP1;
            document.getElementById('display-name-p2').style.color = config.colorP2;
            document.getElementById('wrap-p1').style.boxShadow = `0 0 12px ${config.colorP1}`;
            document.getElementById('wrap-p2').style.boxShadow = `0 0 12px ${config.colorP2}`;
            document.getElementById('wrap-p1').style.border = `2px solid ${config.colorP1}`;
            document.getElementById('wrap-p2').style.border = `2px solid ${config.colorP2}`;
            document.getElementById('fill-p1').style.background = `linear-gradient(90deg, transparent, ${config.colorP1})`;
            document.getElementById('fill-p2').style.background = `linear-gradient(270deg, transparent, ${config.colorP2})`;

            document.getElementById('target-date-input').value = config.targetDate.slice(0, 16);
            document.getElementById('quote-input').value = config.quote;
            document.getElementById('name-p1-input').value = config.nameP1;
            document.getElementById('name-p2-input').value = config.nameP2;
            document.getElementById('color-p1-input').value = config.colorP1;
            document.getElementById('color-p2-input').value = config.colorP2;
            document.getElementById('color-text-input').value = config.textColor;
        }

        function checkPasscode() {
            if (document.getElementById('passcode-input').value === config.passcode) {
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 500);
            } else {
                showAlert('رمز السر غير صحيح!');
            }
        }

        function lockApp() {
            document.getElementById('passcode-input').value = '';
            document.getElementById('lock-screen').style.display = 'flex';
            setTimeout(() => document.getElementById('lock-screen').style.opacity = '1', 10);
        }

        let isCelebrating = false;
        let isZeroReached = false; // متغير للتحقق من وصول العداد للصفر

        function updateTimer() {
            const now = new Date().getTime();
            const target = new Date(config.targetDate).getTime();
            const diff = target - now;

            const containerWidth = document.getElementById('avatars-container').offsetWidth || 350;
            const avatarWidth = 50;
            const maxShift = (containerWidth / 2) - (avatarWidth / 2);

            if (diff <= 0 || isCelebrating) {
                isZeroReached = true;
                document.getElementById('cd-days').innerText = "00";
                document.getElementById('cd-hours').innerText = "00";
                document.getElementById('cd-mins').innerText = "00";
                document.getElementById('cd-secs').innerText = "00";
                document.getElementById('progress-status-text').innerText = "✨ اكتمل اللقاء واندماج الأرواح ✨";

                document.getElementById('p1-box').style.transform = `translateX(-${maxShift}px)`;
                document.getElementById('p2-box').style.transform = `translateX(${maxShift}px)`;

                document.getElementById('fill-p1').style.width = '50%';
                document.getElementById('fill-p2').style.width = '50%';

                document.getElementById('track-card-el').classList.add('fusing');
                return;
            }

            isZeroReached = false;
            document.getElementById('track-card-el').classList.remove('fusing');

            document.getElementById('cd-days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('cd-hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById('cd-mins').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById('cd-secs').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

            const start = new Date("2026-01-01T00:00:00").getTime();
            let progress = Math.max(0, Math.min(1, (now - start) / (target - start)));

            const fillVal = (progress * 50).toFixed(1) + '%';
            document.getElementById('fill-p1').style.width = fillVal;
            document.getElementById('fill-p2').style.width = fillVal;

            const shiftPX = (progress * maxShift).toFixed(1);
            document.getElementById('p1-box').style.transform = `translateX(-${shiftPX}px)`;
            document.getElementById('p2-box').style.transform = `translateX(${shiftPX}px)`;

            document.getElementById('progress-status-text').innerText = `نسبة التقارب: ${(progress * 100).toFixed(2)}%`;
        }

        setInterval(updateTimer, 1000);

        // إعدادات الألعاب النارية المحدثة بدقة
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x; 
                this.y = y; 
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2.5 + 1; // سرعة أهدأ
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 0.7; // شفافية ألطف في الأمام
                this.decay = Math.random() * 0.012 + 0.008;
            }
            update() { 
                this.x += this.vx; 
                this.y += this.vy; 
                this.vy += 0.02; // الجاذبية
                this.alpha -= this.decay; 
            }
            draw() {
                ctx.save(); 
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); // حجم أنيق وهادئ
                ctx.fillStyle = this.color; 
                ctx.fill(); 
                ctx.restore();
            }
        }

        function createFirework() {
            // الانطلاق ينشط فقط عند الصفر أو بتبديل الزر
            if (!isZeroReached && !isCelebrating) return;

            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6);
            const colors = [config.colorP1, config.colorP2, config.textColor, '#ffffff', '#ffd700', '#a7f3d0'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 25; // عدد هادئ وأنيق للجسيمات
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); 
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
        setInterval(createFirework, 700); // إطلاق احتفالي هادئ بفاصل زمني منتظم

        function toggleCelebration(state) {
            isCelebrating = state !== undefined ? state : !isCelebrating;
            updateTimer();
        }

        function openModal() { document.getElementById('settings-modal').classList.add('active'); }
        function closeModal() { document.getElementById('settings-modal').classList.remove('active'); }

        function saveSettings() {
            config.targetDate = document.getElementById('target-date-input').value;
            config.quote = document.getElementById('quote-input').value;
            config.nameP1 = document.getElementById('name-p1-input').value;
            config.nameP2 = document.getElementById('name-p2-input').value;
            config.colorP1 = document.getElementById('color-p1-input').value;
            config.colorP2 = document.getElementById('color-p2-input').value;
            config.textColor = document.getElementById('color-text-input').value;

            const newPass = document.getElementById('new-passcode-input').value;
            if (newPass.trim() !== '') config.passcode = newPass.trim();

            const fileP1 = document.getElementById('img-p1-input').files[0];
            const fileP2 = document.getElementById('img-p2-input').files[0];

            if (fileP1) {
                const reader = new FileReader();
                reader.onload = function(e) { config.imgP1 = e.target.result; finalizeSave(); };
                reader.readAsDataURL(fileP1);
            } else if (fileP2) {
                const reader = new FileReader();
                reader.onload = function(e) { config.imgP2 = e.target.result; finalizeSave(); };
                reader.readAsDataURL(fileP2);
            } else { finalizeSave(); }
        }

        function resetToDefaults() {
            config = {...defaultSettings};
            localStorage.removeItem('soul_meet_config_v5');
            initUI();
            closeModal();
            showAlert('تمت إعادة التعيين للإعدادات الافتراضية!');
        }

        function finalizeSave() {
            localStorage.setItem('soul_meet_config_v5', JSON.stringify(config));
            initUI();
            closeModal();
            showAlert('تم حفظ التغييرات بنجاح!');
        }

        initUI();
        updateTimer();
    </script>
</body>
</html>
