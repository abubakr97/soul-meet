<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لقاء الأرواح</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d0f18 0%, #1a1c29 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* نافذة القفل بكلمة السر */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 24, 0.96);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 350px;
            width: 90%;
        }

        .lock-box h2 {
            margin-bottom: 15px;
            font-size: 22px;
            color: #ffb7c5;
        }

        .lock-box p {
            margin-bottom: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .lock-box input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            letter-spacing: 3px;
        }

        .lock-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* الكانفاس للألعاب النارية */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* حاوية الويب الأساسية بدون إطار جوال */
        .web-container {
            width: 100%;
            max-width: 480px;
            background: #141722;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .app-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-title {
            font-size: 19px;
            font-weight: 700;
            color: #fff;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .app-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .quote-box {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        .quote-text {
            font-size: 14px;
            color: #ffb7c5;
            font-weight: 500;
            line-height: 1.5;
        }

        /* بطاقة المسار والأفاتار */
        .track-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .avatars-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .person-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 2;
        }

        .avatar-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 3px;
            position: relative;
            transition: all 0.5s ease;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2e43;
        }

        .person-name {
            font-size: 15px;
            font-weight: 700;
        }

        /* حركة الدوران الحلزوني عند اللقاء */
        .fusing .avatars-container {
            justify-content: center;
            gap: 0;
        }

        .fusing .avatar-wrapper.person1 {
            animation: spiralRotateLeft 3s infinite linear;
        }

        .fusing .avatar-wrapper.person2 {
            animation: spiralRotateRight 3s infinite linear;
        }

        @keyframes spiralRotateLeft {
            0% { transform: rotate(0deg) translateX(20px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
        }

        @keyframes spiralRotateRight {
            0% { transform: rotate(0deg) translateX(-20px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(-20px) rotate(-360deg); }
        }

        .progress-track-bg {
            width: 90%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill-right {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 50%;
            border-radius: 4px 0 0 4px;
        }

        .progress-fill-left {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            border-radius: 0 4px 4px 0;
        }

        .progress-status {
            font-size: 13px;
            color: #aaa;
            margin-top: 5px;
        }

        /* العداد */
        .countdown-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }

        .countdown-title {
            font-size: 13px;
            color: #8f95b2;
            margin-bottom: 10px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

            background: rgba(255,
